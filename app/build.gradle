plugins { id 'com.android.application' }

android {
    namespace 'rs.komejezvao'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile rootProject.file('test-signing.jks')
            storePassword 'srpskiglas-test'
            keyAlias 'srpskiglas-test'
            keyPassword 'srpskiglas-test'
        }
    }

    defaultConfig {
        applicationId 'rs.komejezvao'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.2.0'
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
